<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Where Is Maru?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2a1a;--cream:#fff8ec;--pink:#ff7aa8;--red:#e8382f;--blue:#3d7bd9;--green:#3bb36b;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
img{pointer-events:none;-webkit-user-drag:none}
button{transition:transform .08s ease-out}
button:active{transform:scale(.94)}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:"Baloo 2","PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:4px solid #f3e2c4}
header h1{font-size:clamp(20px,2.6vw,32px);margin:0;flex:1;font-weight:800}
.hbtn{border:0;background:#f3e2c4;color:var(--ink);font:inherit;font-weight:800;font-size:clamp(16px,1.8vw,22px);border-radius:99px;padding:6px 18px;cursor:pointer}
.pp{display:flex;gap:6px}
.pp i{width:clamp(28px,3vw,40px);height:clamp(28px,3vw,40px);border-radius:50%;border:3px dashed #e2c9a0;display:flex;align-items:center;justify-content:center;font-style:normal;background:#fff}
.pp i.f{border:3px solid var(--red);background:#ffecec}
.pp i img{width:80%}
main{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;padding:10px 16px 16px;gap:min(14px,1.8vh)}
.screen.on{display:flex}
.screen>*{max-width:100%}
.big{font-size:clamp(26px,min(4.4vw,6.4vh),56px);font-weight:800;text-align:center;line-height:1.15;margin:0}
.sub{font-size:clamp(15px,1.8vw,22px);text-align:center;margin:0;opacity:.7}
.cta{border:0;background:var(--pink);color:#fff;font:inherit;font-weight:800;font-size:clamp(22px,3vw,36px);border-radius:99px;padding:8px 40px;box-shadow:0 6px 0 #d14c7f;cursor:pointer}
.cta.hide{visibility:hidden}
.spk{border:0;background:var(--blue);color:#fff;width:clamp(60px,7.5vw,92px);height:clamp(60px,7.5vw,92px);border-radius:50%;font-size:clamp(28px,3.8vw,44px);box-shadow:0 6px 0 #2a59a3;cursor:pointer;flex:none}
.watch{border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:clamp(20px,2.6vw,32px);border-radius:99px;padding:6px 30px;box-shadow:0 6px 0 #a8241d;cursor:pointer}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.steps{display:flex;gap:10px;align-items:center}
.steps i{width:clamp(30px,3.4vw,44px);height:clamp(30px,3.4vw,44px);border-radius:50%;background:#ead6b3;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:clamp(16px,1.8vw,22px);color:#fff}
.steps i.f{background:var(--green)}
.steps i.c{background:var(--gold);color:var(--ink);transform:scale(1.15)}
/* home */
.hero{height:clamp(110px,22vh,230px)}
.trip{display:flex;gap:clamp(10px,1.4vw,22px);align-items:flex-end;justify-content:center;flex-wrap:wrap}
.stop{border:0;background:#fff;border-radius:24px;width:clamp(120px,15vw,200px);padding:12px 8px;box-shadow:0 8px 0 #ead6b3;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.stop img{width:min(70%,15vh);aspect-ratio:1;object-fit:contain}
.stop .n{position:absolute;top:-14px;left:-8px;background:var(--gold);width:44px;height:44px;border-radius:50%;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #d9a520}
.stop b{display:block;font-size:clamp(15px,1.7vw,24px);line-height:1.15}
.stop.locked{filter:grayscale(1);opacity:.55}
.stop.locked::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px}
.stop .done{position:absolute;top:-14px;right:-8px;font-size:40px;display:none}
.stop.cleared .done{display:block}
/* globe */
.globeBox{position:relative;height:min(52vh,440px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:none;padding:0}
.globeBox img{height:100%}
.globeBox.spin img{animation:spinY .45s linear infinite}
.globeBox.hintc{animation:glowR 1.2s infinite;border-radius:50%}
@keyframes spinY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.stopBtn{border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:clamp(34px,5vw,64px);border-radius:28px;padding:6px 48px;box-shadow:0 8px 0 #a8241d;cursor:pointer}
.stopBtn.hide{visibility:hidden}
/* maps */
.mapbox{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #ead6b3;cursor:pointer;flex:none}
.mapbox svg{display:block;width:100%;height:auto}
.ring{position:absolute;border-radius:50%;border:6px solid var(--gold);pointer-events:none;animation:glow 1.1s infinite;display:none}
.ring.on{display:block}
#plane{position:absolute;width:13%;display:none;transition:left 1.8s ease-in-out,top 1.8s ease-in-out;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
#plane.tap{animation:glow 1.1s infinite;border-radius:30%}
.mapbox.zoom{animation:zoomIn .9s ease-out}
@keyframes zoomIn{from{transform:scale(.35);opacity:.2}to{transform:scale(1);opacity:1}}
.subtitle{min-height:1.4em;font-size:clamp(20px,min(2.8vw,4vh),36px);font-weight:800;color:var(--blue);text-align:center;margin:0}
.subtitle b{color:var(--red)}
.pop{position:absolute;font-size:clamp(30px,4vw,54px);pointer-events:none;animation:popup 1s ease-out forwards;z-index:4}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-80%) scale(1.2);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
/* cards */
.grid{display:grid;gap:clamp(14px,2vw,30px);max-width:96vw}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));width:min(80vw,72vh,760px)}
.card{border:0;background:#fff;border-radius:26px;padding:12px;box-shadow:0 7px 0 #ead6b3;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--ink);position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:contain}
.card span{font-weight:800;font-size:clamp(14px,1.6vw,22px);opacity:.55}
.card.ok{outline:7px solid var(--green);animation:pop .5s}
.card.no{animation:shake .45s}
.card.dim{opacity:.35;pointer-events:none}
.card.hintc{animation:glow 1.2s infinite}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 0 0 12px rgba(255,200,61,.9)}}
@keyframes glowR{50%{box-shadow:0 0 0 14px rgba(255,200,61,.9)}}
.progress{display:flex;gap:8px}
.progress i{width:18px;height:18px;border-radius:50%;background:#ead6b3}
.progress i.f{background:var(--gold)}
/* say it */
#sayit{position:fixed;inset:0;background:rgba(255,248,236,.94);z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
#sayit.on{display:flex}
#sayit .line{font-size:clamp(34px,min(6vw,9vh),84px);font-weight:800;text-align:center;line-height:1.1;padding:0 20px}
#sayit .mic{width:clamp(110px,18vh,180px);height:clamp(110px,18vh,180px);border-radius:50%;background:#fff;box-shadow:0 8px 0 #ead6b3;display:flex;align-items:center;justify-content:center;font-size:clamp(56px,10vh,96px);position:relative}
#sayit .mic.go{animation:micPulse .8s infinite}
@keyframes micPulse{50%{transform:scale(1.12);box-shadow:0 0 0 18px rgba(255,122,168,.35)}}
#sayit .lab{font-size:clamp(22px,3.4vh,34px);font-weight:800;color:var(--pink);min-height:1.3em}
#sayit .dots{display:flex;gap:12px}
#sayit .dots i{width:22px;height:22px;border-radius:50%;background:#ead6b3}
#sayit .dots i.f{background:var(--pink)}
/* done */
.passport{background:#2f5ea8;border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 #1f3f73}
.passport b{color:#fff;font-size:clamp(18px,2.2vw,28px);letter-spacing:2px}
.passport .slots{display:flex;gap:clamp(8px,1.4vw,16px)}
.passport .slots i{width:clamp(64px,9vh,96px);height:clamp(64px,9vh,96px);border-radius:50%;border:4px dashed #9fb9e6;background:#fff8ec;display:flex;align-items:center;justify-content:center}
.passport .slots i.f{border:5px solid var(--red)}
.passport .slots i img{width:72%}
.passport .slots i.new{animation:stamp .6s ease-out}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.learned{display:flex;flex-direction:column;gap:10px;width:min(92vw,760px)}
.say{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:8px 20px 8px 8px;box-shadow:0 5px 0 #ead6b3;cursor:pointer;border:0;font:inherit;color:var(--ink)}
.say img{width:clamp(50px,7vh,76px);aspect-ratio:1;object-fit:contain}
.say span{font-size:clamp(20px,min(2.8vw,4vh),36px);font-weight:800;text-align:left}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.6);background:#fff;border-radius:99px;padding:10px 34px;font-size:clamp(24px,3.4vw,48px);font-weight:800;box-shadow:0 8px 0 #ead6b3;opacity:0;transition:.25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#buddy{position:fixed;left:10px;bottom:8px;width:clamp(60px,8vw,120px);z-index:40;pointer-events:none;display:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
#buddy.on{display:block}
#buddy.yay{animation:yay .7s}
#buddy.oops{animation:shake .45s}
@keyframes yay{30%{transform:translateY(-36px) rotate(-8deg)}60%{transform:translateY(0)}80%{transform:translateY(-10px)}}
#vbox{position:fixed;inset:0;background:rgba(30,20,10,.85);z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#vbox.on{display:flex}
#vbox iframe{width:min(92vw,150vh);aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
</style>
</head>
<body>
<div id="app">
<header>
  <button class="hbtn" id="homeBtn">🏠 Map</button>
  <h1>Where Is Maru?</h1>
  <div class="pp" id="hdrPP"></div>
</header>
<main>
  <!-- HOME -->
  <section class="screen on" id="s-home">
    <img class="hero" src="img/maru_jump.png" alt="">
    <p class="big">Where Is Maru?</p>
    <button class="watch" id="watchAll">▶ Watch the video 看完整影片</button>
    <div class="trip">
      <button class="stop" data-go="1"><div class="n">1</div><span class="done">✅</span><img src="img/plane.png" alt=""><b>Fly to Japan!</b></button>
      <button class="stop locked" data-go="2"><div class="n">2</div><span class="done">✅</span><img src="img/maru_sit.png" alt=""><b>Hello, Maru!</b></button>
      <button class="stop locked" data-go="3"><div class="n">3</div><span class="done">✅</span><img src="img/w_door.png" alt=""><b>Knock, Knock!</b></button>
      <button class="stop locked" data-go="4"><div class="n">4</div><span class="done">✅</span><img src="img/maru_peek.png" alt=""><b>Find Maru!</b></button>
      <button class="stop locked" data-go="5"><div class="n">5</div><span class="done">✅</span><img src="img/w_cherry.png" alt=""><b>Come and Play!</b></button>
    </div>
    <button class="hbtn" id="soundTest">🔊 Sound check 測試聲音</button>
  </section>

  <!-- 1-1 watch -->
  <section class="screen" id="s-1w">
    <div class="steps" id="st1"></div>
    <p class="big">Fly to Japan!</p>
    <div class="row"><img class="hero" src="img/w_taiwan.png" alt=""><img class="hero" src="img/plane.png" alt=""><img class="hero" src="img/w_japan.png" alt=""></div>
    <p class="sub">先看這一段影片，再按 Next</p>
    <div class="row"><button class="watch" id="clip1">▶ Watch 看這一段</button><button class="cta" id="w1Go">Next ▶</button></div>
  </section>

  <!-- 1-2 globe -->
  <section class="screen" id="s-1g">
    <div class="steps" id="st2"></div>
    <div class="row"><p class="big" id="gTitle">Tap the globe!</p><button class="spk" id="gSpk">🔊</button></div>
    <button class="globeBox" id="globe"><img src="img/w_globe.png" alt=""></button>
    <button class="stopBtn hide" id="stopBtn">STOP!</button>
  </section>

  <!-- 1-3 map -->
  <section class="screen" id="s-1m">
    <div class="steps" id="st3"></div>
    <div class="row"><p class="big" id="mapTitle"></p><button class="spk" id="mapSpk">🔊</button></div>
    <div class="mapbox" id="mapBox"><div id="mapSvg"></div><div class="ring" id="ring"></div><img id="plane" src="img/plane.png" alt=""></div>
    <p class="subtitle" id="mapSub"></p>
  </section>

  <!-- 1-4 quiz -->
  <section class="screen" id="s-1q">
    <div class="steps" id="st4"></div>
    <div class="progress" id="qprog"></div>
    <div class="row"><button class="spk" id="qSpk">🔊</button><p class="big">Listen and tap!</p></div>
    <div class="grid g2" id="qGrid"></div>
  </section>

  <!-- station done -->
  <section class="screen" id="s-done">
    <p class="big" id="doneTitle">Great job!</p>
    <div class="passport"><b>MY JAPAN PASSPORT</b><div class="slots" id="ppSlots"></div></div>
    <p class="sub">Tap and say it! 點一點，跟著說</p>
    <div class="learned" id="learned"></div>
    <button class="cta" id="doneBtn">Map ▶</button>
  </section>
</main>
</div>
<div id="sayit"><div class="line" id="sayLine"></div><div class="mic" id="sayMic">🎤</div><div class="lab" id="sayLab"></div><div class="dots" id="sayDots"><i></i><i></i><i></i></div></div>
<div class="toast" id="toast"></div>
<img id="buddy" src="img/maru_peek.png" alt="">
<div id="vbox"><div id="vslot"></div><button class="cta" id="vclose">✕ Done 看完了</button></div>
<canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const VID='qED_TBDbxOk';
const ICON={1:'plane',2:'maru_sit',3:'w_door',4:'maru_peek',5:'w_cherry'};
/* ---------- audio engine (Safari-safe: WebAudio + <audio> fallback) ---------- */
const AC=new (window.AudioContext||window.webkitAudioContext)();
const BUF={}; let curSrc=null, curEl=null, playToken=0;
const ALL=[...Array(12)].map((_,i)=>'L'+String(i+1).padStart(2,'0')).concat(['I_globe','I_stop','I_taiwan','I_japan','I_plane','I_islands','I_listen','I_sayit','I_try','I_great','I_stamp','W_taiwan','W_japan','W_islands','W_plane','W_globe']);
async function loadBuf(id){if(id in BUF)return BUF[id];try{const ab=await (await fetch(`audio/${id}.mp3`)).arrayBuffer();BUF[id]=await new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no))}catch(e){BUF[id]=null}return BUF[id]}
ALL.forEach(loadBuf);
function unlock(){try{if(AC.state!=='running'){AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}}catch(e){}}
['pointerdown','pointerup','mousedown','touchstart','touchend','click','keydown'].forEach(e=>addEventListener(e,unlock,{passive:true,capture:true}));
function stopAudio(){playToken++;if(curSrc){try{curSrc.stop()}catch(e){}curSrc=null}if(curEl){try{curEl.pause()}catch(e){}curEl=null}}
function playEl(id){return new Promise(res=>{const a=new Audio(`audio/${id}.mp3`);curEl=a;let done=false;const fin=()=>{if(!done){done=true;res()}};a.onended=fin;a.onerror=fin;
  a.play().then(()=>{setTimeout(fin,((a.duration||8)+1)*1000)}).catch(fin)})}
async function play(...ids){stopAudio();const tok=playToken;unlock();
  for(const id of ids){if(tok!==playToken)return false;
    if(AC.state!=='running'){await new Promise(r=>setTimeout(r,60))}
    if(AC.state==='running'){const b=await loadBuf(id);if(tok!==playToken)return false;
      if(b){await new Promise(res=>{const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.onended=res;curSrc=s;s.start();setTimeout(res,b.duration*1000+600)})}else await playEl(id)}
    else await playEl(id);
    if(tok!==playToken)return false;await new Promise(r=>setTimeout(r,150))}
  return true}
function sfx(type){try{const c=AC,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(.18,t);
  if(type==='ok'){o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36)}
  else if(type==='pop'){o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1200,t+.12);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21)}
  else if(type==='tick'){o.type='sine';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.13)}
  else{o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(140,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- helpers ---------- */
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let cleared=[]; try{cleared=JSON.parse(localStorage.getItem('findmaru5')||'[]')}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1300)}
const buddy=$('#buddy');
function cheer(ok){buddy.classList.remove('yay','oops');void buddy.offsetWidth;buddy.classList.add(ok?'yay':'oops')}
function good(){sfx('ok');cheer(true)}
function bad(){sfx('no');cheer(false)}
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));buddy.classList.toggle('on',id!=='s-home');window.scrollTo(0,0)}
function steps(el,cur,n=4){el.innerHTML='';for(let i=1;i<=n;i++){const d=document.createElement('i');d.textContent=i;if(i<cur)d.className='f';if(i===cur)d.className='c';el.append(d)}}
function prog(el,n,f){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i<f)d.className='f';el.append(d)}}
function card(img,label){const b=document.createElement('button');b.className='card';b.innerHTML=`<img src="img/${img}.png" alt="">`+(label?`<span>${label}</span>`:'');return b}
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:5+Math.random()*7,c:['#ff7aa8','#ffc83d','#3d7bd9','#3bb36b','#e8382f'][Math.random()*5|0],w:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.w)/12)*1.5;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});if(++f<220)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
/* say it: play the line, then mic pulses 3 s for the child to repeat */
let sayFirst=true;
async function sayIt(line,text){const S=$('#sayit');$('#sayLine').innerHTML=text;$('#sayLab').textContent='';const M=$('#sayMic');M.classList.remove('go');const D=$$('#sayDots i');D.forEach(d=>d.className='');S.classList.add('on');
  await play(line);if(sayFirst){sayFirst=false;await play('I_sayit')}
  $('#sayLab').textContent='Your turn! 換你說';M.classList.add('go');
  for(let i=0;i<3;i++){await wait(SAYMS);D[i].className='f';sfx('tick')}
  M.classList.remove('go');S.classList.remove('on')}
let SAYMS=1000;
/* video popup */
function openVideo(start,end){stopAudio();$('#vslot').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${VID}?rel=0&modestbranding=1&playsinline=1&autoplay=1${start!=null?`&start=${start}&end=${end}`:''}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;$('#vbox').classList.add('on')}
$('#vclose').onclick=()=>{$('#vslot').innerHTML='';$('#vbox').classList.remove('on')};
$('#watchAll').onclick=()=>openVideo();
$('#soundTest').onclick=()=>play('I_great');
/* home + passport */
function drawPP(){const h=$('#hdrPP');h.innerHTML='';for(let n=1;n<=5;n++){const i=document.createElement('i');if(cleared.includes(n)){i.className='f';i.innerHTML=`<img src="img/${ICON[n]}.png" alt="">`}h.append(i)}}
function refresh(){$$('.stop').forEach(s=>{const n=+s.dataset.go;s.classList.toggle('cleared',cleared.includes(n));s.classList.toggle('locked',n>1&&!cleared.includes(n-1))});drawPP()}
refresh();
const START={1:start1w};
$$('.stop').forEach(s=>s.onclick=()=>{const n=+s.dataset.go;if(s.classList.contains('locked')||!START[n]){toast(n>1&&cleared.includes(n-1)||!START[n]?'Coming soon! 製作中':'先完成上一站！');return}START[n]()});
let lp;$('header h1').addEventListener('pointerdown',()=>lp=setTimeout(()=>{cleared=[1,2,3,4,5];refresh();toast('老師模式：全部解鎖')},1500));
['pointerup','pointerleave'].forEach(e=>$('header h1').addEventListener(e,()=>clearTimeout(lp)));
$('#homeBtn').onclick=()=>{stopAudio();$('#sayit').classList.remove('on');show('s-home');refresh()};
function clearSt(n){const isNew=!cleared.includes(n);if(isNew)cleared.push(n);try{localStorage.setItem('findmaru5',JSON.stringify(cleared))}catch(e){}return isNew}

/* ===== STATION 1 · Fly to Japan! ===== */
function start1w(){steps($('#st1'),1);show('s-1w')}
$('#clip1').onclick=()=>openVideo(0,43);
$('#w1Go').onclick=start1g;
// globe: tap to spin, tap STOP
let gState=0;
function start1g(){steps($('#st2'),2);gState=0;const g=$('#globe');g.classList.remove('spin');g.classList.add('hintc');$('#stopBtn').classList.add('hide');$('#gTitle').textContent='Tap the globe!';$('#gSpk').onclick=()=>play('I_globe');show('s-1g');play('I_globe')}
$('#globe').onclick=async()=>{if(gState!==0)return;gState=1;const g=$('#globe');g.classList.remove('hintc');g.classList.add('spin');sfx('ok');
  await play('L01');if(gState!==1)return;$('#gTitle').textContent='Tap STOP!';$('#gSpk').onclick=()=>play('I_stop');$('#stopBtn').classList.remove('hide');play('I_stop')};
$('#stopBtn').onclick=async()=>{if(gState!==1)return;gState=2;$('#globe').classList.remove('spin');$('#stopBtn').classList.add('hide');good();await play('L02');await wait(300);start1m()};
// map journey
const MAPS={};
async function getMap(n){if(!MAPS[n])MAPS[n]=await (await fetch(`img/${n}.svg`)).text();return MAPS[n]}
let mStep='', mmiss=0, mlock=false, isl=new Set();
async function loadMap(name){$('#mapSvg').innerHTML=await getMap(name);const tk=$('#mapSvg #tokyo');tk&&tk.remove();const vb=$('#mapSvg svg').viewBox.baseVal;$('#mapBox').style.width=`min(94vw, calc((100dvh - 300px) * ${(vb.width/vb.height).toFixed(3)}), 1050px)`;$('#plane').style.display='none';$('#plane').classList.remove('tap')}
function setTask(step,title,ask){mStep=step;mmiss=0;mlock=false;$('#ring').classList.remove('on');$('#mapTitle').textContent=title;$('#mapSpk').onclick=()=>play(...ask);return play(...ask)}
async function start1m(){steps($('#st3'),3);await loadMap('east_asia_map');$('#mapSub').innerHTML='';show('s-1m');setTask('tw','Where is Taiwan?',['I_taiwan'])}
function rectOf(el){const r=el.getBoundingClientRect(),b=$('#mapBox').getBoundingClientRect();return {x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height,bw:b.width}}
function ringOn(el){const r=rectOf(el),pad=Math.max(r.bw*.03,16),d=Math.max(r.w,r.h)+pad*2,R=$('#ring');R.style.width=R.style.height=d+'px';R.style.left=(r.x+r.w/2-d/2)+'px';R.style.top=(r.y+r.h/2-d/2)+'px';R.classList.add('on')}
function hitEl(el,e){const r=rectOf(el),b=$('#mapBox').getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,pad=Math.max(r.bw*.035,18);return x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad}
function paint(el,c){(el.tagName==='g'?[...el.querySelectorAll('path')]:[el]).forEach(p=>p.setAttribute('fill',c))}
function popAt(e,txt){const b=$('#mapBox').getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=(e.clientX-b.left)+'px';p.style.top=(e.clientY-b.top)+'px';$('#mapBox').append(p);setTimeout(()=>p.remove(),1000)}
function miss(el,ask){bad();mmiss++;if(mmiss>=2)ringOn(el);play('I_try',...ask)}
$('#mapBox').addEventListener('click',async e=>{if(mlock||!$('#s-1m').classList.contains('on'))return;const svg=$('#mapSvg');
  if(mStep==='tw'){const el=svg.querySelector('#map-tw');if(!hitEl(el,e))return miss(el,['I_taiwan']);
    mlock=true;$('#ring').classList.remove('on');good();paint(el,'#5cc978');$('#mapSub').innerHTML='<b>Taiwan!</b> We are here!';await sayIt('L03','Taiwan! We are here!');
    await setTask('jp','Where is Japan?',['L04','I_japan'])}
  else if(mStep==='jp'){const el=svg.querySelector('#map-jp');if(!hitEl(el,e))return miss(el,['I_japan']);
    mlock=true;$('#ring').classList.remove('on');good();paint(el,'#ff8fb5');$('#mapSub').innerHTML='Here! <b>Japan!</b> So close!';await play('L05','L06');
    $('#mapSub').innerHTML='<b>Japan</b> is in Asia. <b>Taiwan</b> is in Asia, too!';await play('L07','L08');
    // plane on Taiwan
    const P=$('#plane'),tw=rectOf(svg.querySelector('#map-tw'));P.style.transition='none';P.style.display='block';P.style.left=(tw.x+tw.w+4)+'px';P.style.top=(tw.y-P.offsetHeight*.35)+'px';P.classList.add('tap');
    $('#mapSub').innerHTML='';setTask('plane','Tap the plane!',['I_plane'])}
  else if(mStep==='plane'){const P=$('#plane');if(!e.target.closest('#plane')&&!hitEl(P,e))return miss(P,['I_plane']);
    mlock=true;P.classList.remove('tap');good();await sayIt('L09',"Let's go to Japan!");
    const jp=rectOf(svg.querySelector('#map-jp'));void P.offsetWidth;P.style.transition='';P.style.left=(jp.x+jp.w*.2)+'px';P.style.top=(jp.y+jp.h*.45)+'px';await wait(1900);
    play('L10');await wait(700);await loadMap('japan_map');const mb=$('#mapBox');mb.classList.remove('zoom');void mb.offsetWidth;mb.classList.add('zoom');await wait(900);
    isl=new Set();$('#mapSub').innerHTML='Look! <b>Islands!</b>';setTask('isl','Tap the islands!',['L11','I_islands'])}
  else if(mStep==='isl'){const ids=['map-hokkaido','map-honshu','map-kyushu','map-shikoku'];let hit=e.target.closest('path')?.id;
    if(!ids.includes(hit)){hit=ids.find(id=>!isl.has(id)&&hitEl(svg.querySelector('#'+id),e))}
    if(!hit){const left=ids.find(id=>!isl.has(id));return miss(svg.querySelector('#'+left),['I_islands'])}
    if(isl.has(hit))return;isl.add(hit);mmiss=0;$('#ring').classList.remove('on');sfx('pop');cheer(true);paint(svg.querySelector('#'+hit),['#ff8fb5','#ffc83d','#7cc7ff','#8fdc9b'][isl.size-1]);popAt(e,'🏝️');
    if(isl.size===4){mlock=true;await wait(500);$('#mapSub').innerHTML='<b>Japan</b> has many <b>islands</b>!';await sayIt('L12','Japan has many islands!');start1q()}}
});
// listen and tap (2 choices)
const QS=[['taiwan','japan'],['japan','plane'],['islands','globe'],['plane','taiwan']];
const LAB={taiwan:'Taiwan',japan:'Japan',islands:'islands',plane:'plane',globe:'globe'};
const IMG={taiwan:'w_taiwan',japan:'w_japan',islands:'w_islands',plane:'plane',globe:'w_globe'};
let qi=0;
function start1q(){steps($('#st4'),4);qi=0;show('s-1q');play('I_listen').then(ok=>ok&&ask())}
function ask(){const [w,d]=QS[qi];prog($('#qprog'),QS.length,qi);const g=$('#qGrid');g.innerHTML='';let locked=false,miss=0;$('#qSpk').onclick=()=>play('W_'+w);
  shuffle([w,d]).forEach(k=>{const b=card(IMG[k],LAB[k]);b.dataset.k=k;b.onclick=async()=>{if(locked)return;
    if(k===w){locked=true;$$('#qGrid .card').forEach(x=>x.classList.remove('hintc'));b.classList.add('ok');good();await play('W_'+w);qi++;qi<QS.length?setTimeout(ask,300):done1()}
    else{b.classList.add('no');bad();miss++;setTimeout(()=>b.classList.remove('no'),450);if(miss>=2)$$('#qGrid .card').find(x=>x!==b).classList.add('hintc');setTimeout(()=>play('W_'+w),400)}};g.append(b)});
  setTimeout(()=>play('W_'+w),250)}
async function done1(){const isNew=clearSt(1);confetti();$('#doneTitle').textContent='Station 1 clear! ✈️';
  const S=$('#ppSlots');S.innerHTML='';for(let n=1;n<=5;n++){const i=document.createElement('i');if(cleared.includes(n)){i.className='f'+(n===1?' new':'');i.innerHTML=`<img src="img/${ICON[n]}.png" alt="">`}S.append(i)}
  const L=$('#learned');L.innerHTML='';
  [['L03','Taiwan! We are here!','w_taiwan'],['L09',"Let's go to Japan!",'plane'],['L12','Japan has many islands!','w_islands']].forEach(([a,t,i])=>{
    const b=document.createElement('button');b.className='say';b.innerHTML=`<img src="img/${i}.png" alt=""><span>🔊 ${t}</span>`;b.onclick=()=>play(a);L.append(b)});
  show('s-done');drawPP();await play('I_stamp','I_great')}
$('#doneBtn').onclick=()=>{stopAudio();show('s-home');refresh()};
</script>
</body>
</html>
