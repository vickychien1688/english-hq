<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronunciation Check</title>
<style>body{font-family:-apple-system,"PingFang TC",sans-serif;background:#fff8ec;color:#3a2a1a;margin:0;padding:16px}h1{font-size:24px}table{border-collapse:collapse;width:100%;max-width:760px}td,th{padding:8px;border-bottom:1px solid #ead6b3;text-align:center}td:first-child{text-align:left;font-weight:800;font-size:22px}
button{font-size:18px;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;background:#f3e2c4}button.a{background:#ffd3e2}button.b{background:#d6e8ff}</style></head><body>
<h1>Leo's Suitcase 單字發音試聽</h1><p>每個字點三種聽聽看：原本／A（新模型、自然語調）／B（新模型、比較清楚有精神）。</p>
<table><tr><th>單字</th><th>原本</th><th>A</th><th>B</th></tr><tbody id="t"></tbody></table>
<script>const W=['Japan','Taiwan','Asia','country','island','Tokyo','capital','Honshu','Hokkaido','north'];let cur;
function p(f){if(cur)cur.pause();cur=new Audio('audio/pron/'+f+'.mp3');cur.play()}
document.getElementById('t').innerHTML=W.map(w=>{const k='W_'+w.toLowerCase();return `<tr><td>${w}</td><td><button onclick="p('${k}_old')">▶ 原本</button></td><td><button class="a" onclick="p('${k}_m1')">▶ A</button></td><td><button class="b" onclick="p('${k}_m2')">▶ B</button></td></tr>`}).join('')</script></body></html>
