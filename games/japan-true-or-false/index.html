<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Japan: True or False!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2a1a;--cream:#fff8ec;--pink:#ff7aa8;--red:#e8382f;--blue:#3d7bd9;--green:#3bb36b;--gold:#ffc83d;--brown:#9a5b2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
img{pointer-events:none;-webkit-user-drag:none}
button{transition:transform .08s ease-out}
button:active{transform:scale(.94)}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:"Baloo 2","PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:4px solid #f3e2c4}
header h1{font-size:clamp(20px,2.6vw,32px);margin:0;flex:1;font-weight:800}
.stars{font-size:clamp(20px,2.4vw,30px);font-weight:800;background:#fff4cf;border-radius:99px;padding:2px 16px}
.hbtn{border:0;background:#f3e2c4;color:var(--ink);font:inherit;font-weight:800;font-size:clamp(16px,1.8vw,22px);border-radius:99px;padding:6px 18px;cursor:pointer}
main{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;overscroll-behavior:none;padding:10px 16px 16px;gap:min(14px,1.6vh)}
.screen.on{display:flex}
.big{font-size:clamp(24px,min(4vw,6vh),50px);font-weight:800;text-align:center;line-height:1.15;margin:0}
.sub{font-size:clamp(16px,2vw,24px);text-align:center;margin:0;opacity:.8}
.cta{border:0;background:var(--pink);color:#fff;font:inherit;font-weight:800;font-size:clamp(22px,3vw,36px);border-radius:99px;padding:8px 40px;box-shadow:0 6px 0 #d14c7f;cursor:pointer}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #d14c7f}
.cta.hide{visibility:hidden}
.spk{border:0;background:var(--blue);color:#fff;width:clamp(60px,7.5vw,92px);height:clamp(60px,7.5vw,92px);border-radius:50%;font-size:clamp(28px,3.8vw,44px);box-shadow:0 6px 0 #2a59a3;cursor:pointer;flex:none}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 #2a59a3}
.watch{border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:clamp(20px,2.6vw,32px);border-radius:99px;padding:6px 30px;box-shadow:0 6px 0 #a8241d;cursor:pointer}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
/* step dots */
.steps{display:flex;gap:10px;align-items:center}
.steps i{width:clamp(30px,3.4vw,44px);height:clamp(30px,3.4vw,44px);border-radius:50%;background:#ead6b3;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:clamp(16px,1.8vw,22px);color:#fff}
.steps i.f{background:var(--green)}
.steps i.c{background:var(--gold);color:var(--ink);transform:scale(1.15)}
/* home map */
.trip{display:flex;gap:clamp(10px,1.4vw,22px);align-items:flex-end;justify-content:center;flex-wrap:wrap}
.stop{border:0;background:#fff;border-radius:24px;width:clamp(120px,15vw,200px);padding:12px 8px;box-shadow:0 8px 0 #ead6b3;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.stop img{width:min(70%,16vh);aspect-ratio:1;object-fit:contain}
.stop .n{position:absolute;top:-14px;left:-8px;background:var(--gold);width:44px;height:44px;border-radius:50%;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #d9a520}
.stop b{display:block;font-size:clamp(15px,1.7vw,24px);line-height:1.15}
.stop.locked{filter:grayscale(1);opacity:.55}
.stop.locked::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px}
.stop .done{position:absolute;top:-14px;right:-8px;font-size:40px;display:none}
.stop.cleared .done{display:block}
.heroRow{display:flex;align-items:flex-end;gap:10px}
.heroRow .av{height:clamp(90px,17vh,190px)}
.heroRow .case{height:clamp(80px,15vh,170px)}
/* intro */
.post{width:min(80vw,62vh,760px);border-radius:22px;box-shadow:0 8px 0 #ead6b3}
.say{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:8px 20px 8px 8px;box-shadow:0 5px 0 #ead6b3;cursor:pointer;border:0;font:inherit;color:var(--ink)}
.say img{width:clamp(54px,7vh,80px)}
.say span{font-size:clamp(20px,min(2.8vw,4vh),36px);font-weight:800;text-align:left}
/* cards */
.grid{display:grid;gap:clamp(10px,1.4vw,20px)}
.g5{grid-template-columns:repeat(5,minmax(0,1fr));width:min(96vw,125vh,1250px)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));width:min(90vw,95vh,900px)}
.card{border:0;background:#fff;border-radius:22px;padding:8px;box-shadow:0 6px 0 #ead6b3;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:contain}
.card span{font-weight:800;white-space:nowrap;line-height:1.1;font-size:clamp(15px,min(2vw,3vh),28px)}
.card.heard{outline:4px solid var(--green);box-shadow:0 6px 0 #9fd9b4}
.card.ok{outline:6px solid var(--green);animation:pop .5s}
.card.no{animation:shake .45s}
.card.dim{opacity:.35;pointer-events:none}
.card.hintc{animation:glow 1.2s infinite}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,200,61,.85)}}
.subtitle{min-height:1.4em;font-size:clamp(20px,min(2.8vw,4vh),36px);font-weight:800;color:var(--blue);text-align:center;margin:0}
.subtitle b{color:var(--red)}
.progress{display:flex;gap:8px}
.progress i{width:18px;height:18px;border-radius:50%;background:#ead6b3}
.progress i.f{background:var(--gold)}
.wordq{font-size:clamp(40px,min(7vw,9vh),90px);font-weight:800;margin:0;color:var(--ink);background:#fff;border-radius:24px;padding:0 40px;box-shadow:0 6px 0 #ead6b3}
/* maps */
.mapbox{position:relative;width:min(94vw,112vh,1050px);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #ead6b3;cursor:pointer;flex:none}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .ring{position:absolute;border-radius:50%;border:6px solid var(--gold);pointer-events:none;animation:glow 1.1s infinite;display:none}
.mapbox .ring.on{display:block}
#plane{position:absolute;width:11%;display:none;transition:left 1.5s ease-in-out,top 1.5s ease-in-out;z-index:3}
.choices{display:flex;gap:clamp(12px,2vw,30px)}
.choice{border:0;background:#fff;border-radius:24px;box-shadow:0 6px 0 #ead6b3;font:inherit;font-weight:800;font-size:clamp(34px,min(5vw,7vh),72px);padding:10px 34px;cursor:pointer;color:var(--ink)}
.choice.ok{outline:6px solid var(--green)}
.choice.no{animation:shake .45s;opacity:.4}
/* sentence builder */
.sent{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:clamp(64px,10vh,100px);width:min(94vw,1100px);background:#fff;border-radius:22px;padding:12px;box-shadow:inset 0 0 0 4px #f3e2c4;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(94vw,1100px)}
.tile{border:0;background:var(--gold);color:var(--ink);font:inherit;font-weight:800;font-size:clamp(24px,min(3.4vw,5vh),46px);border-radius:16px;padding:4px 22px;box-shadow:0 5px 0 #d9a520;cursor:pointer}
.tile.used{visibility:hidden}
.tile.no{animation:shake .45s}
.tile.hintc{animation:glow 1.2s infinite}
.placed{font-size:clamp(24px,min(3.4vw,5vh),46px);font-weight:800;color:var(--green);animation:pop .4s}
.sentpic{height:clamp(90px,20vh,200px)}
/* summary */
.learned{display:flex;flex-direction:column;gap:12px;width:min(92vw,900px)}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.6);background:#fff;border-radius:99px;padding:10px 34px;font-size:clamp(28px,4vw,56px);font-weight:800;box-shadow:0 8px 0 #ead6b3;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) scale(1)}
#buddy{position:fixed;left:10px;bottom:8px;width:clamp(56px,7vw,110px);z-index:40;pointer-events:none;display:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
#buddy.on{display:block}
#buddy.yay{animation:yay .7s}
#buddy.oops{animation:shake .45s}
@keyframes yay{30%{transform:translateY(-36px) rotate(-8deg)}60%{transform:translateY(0)}80%{transform:translateY(-10px)}}
#bubble{position:fixed;left:clamp(90px,11vw,145px);bottom:clamp(60px,8vw,110px);background:#fff;border-radius:20px;padding:6px 16px;font-weight:800;font-size:clamp(18px,2.2vw,28px);box-shadow:0 4px 0 #ead6b3;z-index:41;opacity:0;transition:.2s;pointer-events:none}
#bubble.on{opacity:1}
#vbox{position:fixed;inset:0;background:rgba(30,20,10,.85);z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#vbox.on{display:flex}
#vbox iframe{width:min(92vw,150vh);aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
/* generic stations */
.g4{grid-template-columns:repeat(4,minmax(0,1fr));width:min(96vw,130vh,1150px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));width:min(80vw,90vh,800px)}
.card.scene img{object-fit:cover;border-radius:14px;aspect-ratio:16/10}
.card.big4 img{aspect-ratio:16/10}
.thumbs{display:flex;gap:24px}
.thumb{border:0;background:#fff;border-radius:24px;box-shadow:0 6px 0 #ead6b3;font-size:clamp(50px,8vw,100px);padding:6px 30px;cursor:pointer}
.thumb.no{animation:shake .45s;opacity:.4}
.thumb.ok{outline:6px solid var(--green)}
.match{display:flex;justify-content:space-between;width:min(92vw,130vh,1000px);gap:20px}
.match .col{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);width:42%}
.mb{border:0;background:#fff;border-radius:18px;box-shadow:0 5px 0 #ead6b3;cursor:pointer;font:inherit;color:var(--ink);height:clamp(64px,14vh,120px);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:clamp(20px,min(3vw,4.4vh),38px);overflow:hidden;padding:0}
.mb img{height:100%;aspect-ratio:16/10;object-fit:cover}
.mb img.st{aspect-ratio:1;object-fit:contain;height:86%}
.mb.sel{outline:6px solid var(--gold)}
.mb.done{outline:5px solid var(--green);background:#eafff0;pointer-events:none}
.mb.no{animation:shake .45s}
.flag{position:relative;width:min(70vw,55vh,560px);aspect-ratio:3/2;background:#fff;border:6px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 #ead6b3;cursor:pointer}
#flagSun{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#d3202f;border:0;cursor:pointer}
#flagSun.hintc{animation:glow 1.2s infinite}
.packTop{display:flex;align-items:center;gap:16px;width:min(96vw,1150px)}
.packTop>div{flex:1}
.packTop .big{text-align:left}.packTop .subtitle{text-align:left}
.packSeason{height:clamp(80px,17vh,170px);border-radius:16px;box-shadow:0 5px 0 #ead6b3}
.packRow{display:flex;gap:20px;align-items:center;width:min(96vw,1150px)}
.suitcase{position:relative;width:clamp(180px,26vw,330px);flex:none}
.suitcase>img{width:100%}
.suitcase .inCase{position:absolute;left:12%;right:12%;top:34%;bottom:14%;display:flex;gap:4%;align-items:center;justify-content:center}
.suitcase .inCase img{width:44%;aspect-ratio:1;object-fit:contain;animation:pop .4s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.suitcase.shake{animation:shake .45s}
.g4i{grid-template-columns:repeat(4,minmax(0,1fr));flex:1}
.g4i .card img{aspect-ratio:1}
.sumGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(96vw,140vh,1200px)}
.sumCard{background:#fff;border-radius:20px;box-shadow:0 6px 0 #ead6b3;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;font:inherit;color:var(--ink);cursor:pointer}
.sumCard>img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px}
.sumCard b{font-size:clamp(18px,2.2vw,28px)}
.sumCard .ic{display:flex;gap:4px;justify-content:center}
.sumCard .ic img{width:30%;aspect-ratio:1;object-fit:contain}
.sumCard small{font-size:clamp(13px,1.4vw,18px);line-height:1.2;text-align:center}
.chart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(98vw,1300px)}
.col4{border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:6px}
.col4.spring{background:#ffe3ee}.col4.summer{background:#fff1c9}.col4.autumn{background:#ffe0c7}.col4.winter{background:#e0f0ff}
.col4 h3{margin:0;text-align:center;font-size:clamp(20px,2.4vw,32px)}
.col4 .lab{font-size:clamp(12px,1.2vw,16px);font-weight:800;opacity:.7;margin:2px 4px -2px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{border:0;background:#fff;border-radius:12px;padding:4px 2px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.chip img{width:80%;aspect-ratio:1;object-fit:contain}
.chip span{font-weight:800;font-size:clamp(11px,1.15vw,16px);line-height:1.05;text-align:center}
.chip.sel{outline:4px solid var(--green)}
.myCase{display:flex;gap:10px;min-height:20px}
.mineRow{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.suitcase.big{width:clamp(220px,30vw,400px)}
.mineText{display:flex;flex-direction:column;gap:6px;font-size:clamp(24px,min(3.4vw,5vh),44px);font-weight:800}
.mineText u{text-decoration:none;color:var(--red)}
@media (max-width:760px){.chart,.sumGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.packRow{flex-direction:column}}
/* fix: pick header in one line, nothing cut */
#g-pick .row{flex-wrap:nowrap;width:min(96vw,1150px);justify-content:center}
#g-pick .row .big{flex:0 1 auto;min-width:0;font-size:clamp(22px,min(3.4vw,5vh),44px)}
#gpPic{height:clamp(70px,15vh,150px);width:auto;max-width:28vw;border-radius:14px;box-shadow:0 5px 0 #ead6b3;flex:none}
.screen{overflow-x:hidden}
.screen>*{max-width:100%}
.grid{max-width:96vw}
.oopsBox{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;width:min(96vw,1150px)}
.oopsPic{width:min(44vw,44vh,520px)}
.oopsSay{max-width:min(46vw,460px)}
.oopsSay .say span{font-size:clamp(18px,min(2.4vw,3.4vh),30px)}
.oopsBox .full{flex-basis:100%;display:flex;justify-content:center}
.oopsBox .grid.full{display:grid;width:min(90vw,90vh,800px);flex-basis:auto}
@media (max-width:760px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Japan True or False extras */
.tfCard{background:#fff;border-radius:24px;box-shadow:0 6px 0 #ead6b3;padding:14px 26px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;width:min(94vw,1100px);min-height:clamp(80px,14vh,140px)}
.tfCard .w{font-size:clamp(28px,min(4.2vw,6vh),56px);font-weight:800;border:0;background:none;font-family:inherit;color:var(--ink);padding:0 4px;border-radius:12px;cursor:default}
.tfCard.fixing .w{cursor:pointer;background:#fff4cf;box-shadow:0 4px 0 #ead6b3}
.tfCard .w.wrong{background:#ffd9d6;color:var(--red);text-decoration:line-through}
.tfCard .w.fixed{background:#dff7e7;color:var(--green)}
.tfCard .w.no{animation:shake .45s}
.tfCard .w.hintc{animation:glow 1.2s infinite}
.tfBtns{display:flex;gap:clamp(16px,3vw,40px)}
.tfb{border:0;font:inherit;font-weight:800;font-size:clamp(30px,min(4.6vw,7vh),62px);color:#fff;border-radius:24px;padding:8px clamp(26px,4vw,56px);cursor:pointer}
.tfb.t{background:var(--green);box-shadow:0 7px 0 #24814a}.tfb.f{background:var(--red);box-shadow:0 7px 0 #a8241d}
.tfb.no{animation:shake .45s;opacity:.4}.tfb.ok{outline:6px solid var(--gold)}.tfb.hintc{animation:glow 1.2s infinite}
.tfb.hide{display:none}
.fixOpts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#learnGrid{width:min(92vw,88vh,900px)}
#s-1w .post{width:min(80vw,52vh,700px)}
.wordq.sm{font-size:clamp(34px,min(5vw,7vh),70px)}
#s-gw .post{width:min(80vw,46vh,640px)}
.spkI{font-size:clamp(28px,4vh,40px)}
#learnGrid .card span{white-space:normal;text-align:center}
.card.scene span{white-space:nowrap}
#qText{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);align-items:center}
#qText:empty{display:none}
.choice.long{font-size:clamp(20px,min(2.6vw,3.8vh),34px);padding:8px 26px;width:min(90vw,980px);text-align:left;line-height:1.2}
.soQ{font-size:clamp(22px,min(3.2vw,4.6vh),42px);max-width:min(58vw,780px)}
.qpic{border-radius:14px;max-width:30vw;object-fit:cover}
#s-1q .row{flex-wrap:nowrap}
.tfCard.hk{flex-direction:column;gap:2px;padding:10px 20px}
.hl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#hkSeasons{width:min(90vw,80vh,760px)}
#shCard .w,#hoCard .w{font-size:clamp(24px,min(3.6vw,5.2vh),48px);text-align:center}
.w.slot{background:#fff4cf;border-radius:12px;padding:0 12px!important;color:var(--red)!important}
.players{display:flex;gap:clamp(10px,2vw,28px);justify-content:center;flex-wrap:wrap}
.players:empty{display:none}
.pl{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:4px 14px 4px 4px;box-shadow:0 4px 0 #ead6b3;animation:pop .4s}
.pl img{height:clamp(44px,7vh,70px)}.pl .you{font-size:clamp(30px,5vh,48px)}
.pl b{font-size:clamp(18px,2.2vw,28px)}
.pl i{font-style:normal;font-weight:800;color:#fff;border-radius:10px;padding:0 10px;font-size:clamp(16px,2vw,24px)}
.pl i.t{background:var(--green)}.pl i.f{background:var(--red)}
.pl.right::after{content:"✔";color:var(--green);font-size:30px;font-weight:800}
.pl.wrong::after{content:"✘";color:var(--red);font-size:30px;font-weight:800}
.whyBox{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);align-items:center}
.whyBox:empty{display:none}
.scoreBig{font-size:clamp(40px,min(7vw,10vh),100px);color:var(--blue)}
#hoThings{width:min(80vw,80vh,760px)}
#hoSeasons .tile{text-transform:capitalize}
.tile.sel{outline:5px solid var(--green)}
#caOpts{width:min(92vw,100vh,1000px)}
#caOpts .card span,#hoThings .card span{white-space:normal;text-align:center}
#caOpts.g2{width:min(70vw,60vh,620px)}
#caOpts.row{width:auto}
#caLine:empty{display:none}
.blank{font-size:clamp(24px,min(3.4vw,5vh),46px);font-weight:800;color:#c9b48f;letter-spacing:2px}
.placed.fill{color:var(--red)}
#caLine .placed{color:var(--ink)}#caLine .placed.fill{color:var(--red)}
.mcPic{width:min(40vw,42vh,480px);border-radius:20px;box-shadow:0 6px 0 #ead6b3}
#mcText{max-width:min(52vw,640px);background:#fff;border-radius:20px;padding:14px 22px;box-shadow:0 6px 0 #ead6b3}
#mcText u{text-decoration:none;color:var(--red)}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const VID='HmLhb-7ReIE', KEY='jtf5';
/* ---------- content: station 1 ---------- */
const W1=[
 {k:'asia',t:'Asia',img:'w_asia',line:'L04',txt:'Japan is a country in <b>Asia</b>.'},
 {k:'island',t:'island',img:'w_island',line:'L11',txt:'Japan has many <b>islands</b>.'},
 {k:'four',t:'four big islands',img:'w_japan',line:'L15',txt:'<b>Four big islands</b> are Hokkaido, Honshu, Shikoku, and Kyushu.'},
 {k:'honshu',t:'Honshu',img:'w_honshu',line:'L16',txt:'Tokyo is on <b>Honshu</b>.'},
 {k:'tokyo',t:'Tokyo',img:'w_tokyo',line:'L16',txt:'<b>Tokyo</b> is on Honshu.'},
 {k:'capital',t:'capital',img:'w_capital',line:'L17',txt:'It is the <b>capital</b> of Japan.'},
 {k:'flag',t:'flag',img:'w_flag',line:'L19',txt:'Look! What color is the <b>flag</b>?'},
 {k:'sun',t:'sun',img:'a_sun',line:'L21',txt:'The red circle is the <b>sun</b>.'}];
const HEAR=[{line:'L04',img:'w_asia'},{line:'L11',img:'w_island'},{line:'L17',img:'w_capital'},{line:'L19',img:'w_flag'},{line:'L21',img:'a_sun'}];
/* True/False: bad = index of wrong word, opts = replacements (first is right), fix = audio of corrected sentence */
const TF1=[
 {a:'T_1',w:['Japan','is','in','Asia.'],v:1,say:'L04',txt:'Japan is a country in <b>Asia</b>.'},
 {a:'T_7',w:['The','flag','is','blue','and','white.'],v:0,bad:3,opts:['red','green','yellow'],say:'L20',txt:"It's <b>red</b> and white."},
 {a:'T_4',w:['Tokyo','is','the','capital','of','Japan.'],v:1,say:'L17',txt:'Tokyo is the <b>capital</b> of Japan.'},
 {a:'T_5',w:['The','red','circle','on','the','flag','is','the','moon.'],v:0,bad:8,opts:['sun.','star.','flower.'],say:'L21',txt:'The red circle is the <b>sun</b>.'},
 {a:'T_2',w:['Japan','has','125','islands.'],v:0,bad:2,opts:['14,125','4','1,412'],say:'L12',txt:'It has <b>14,125</b> islands!'},
 {a:'T_8',w:['Japan','has','many','islands.'],v:1,say:'L11',txt:'Japan has many <b>islands</b>.'}];
const SENT1=[
 {words:['Tokyo','is','the','capital','of','Japan.'],line:'T_4',img:'w_capital'},
 {words:['Japan','is','a','country','in','Asia.'],line:'L04',img:'w_asia'},
 {words:['The','red','circle','is','the','sun.'],line:'L21',img:'w_flag'}];
/* ---------- audio engine (decode once, instant taps) ---------- */
const AC=new (window.AudioContext||window.webkitAudioContext)();
const BUF={}; let curSrc=null, playToken=0;
const ALL=[...Array(21)].map((_,i)=>'L'+String(i+1).padStart(2,'0')).concat(W1.map(w=>'W_'+w.k),['I_listen','I_asia','I_honshu','I_hear','I_tokyo','I_islands','I_try','I_great','I_tf','I_fix','I_fix2','I_order','I_next','N_true','N_false'],TF1.map(t=>t.a));
async function loadBuf(id){if(id in BUF)return BUF[id];try{const ab=await (await fetch(`audio/${id}.mp3`)).arrayBuffer();BUF[id]=await new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no))}catch(e){BUF[id]=null}return BUF[id]}
ALL.forEach(loadBuf);
function unlock(){try{if(AC.state!=='running'){AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}}catch(e){}}
['pointerdown','pointerup','mousedown','touchstart','touchend','click','keydown'].forEach(e=>addEventListener(e,unlock,{passive:true,capture:true}));
let curEl=null;
function stopAudio(){playToken++;if(curSrc){try{curSrc.stop()}catch(e){}curSrc=null}if(curEl){try{curEl.pause()}catch(e){}curEl=null}}
function playEl(id){return new Promise(res=>{const a=new Audio(`audio/${id}.mp3`);curEl=a;let done=false;const fin=()=>{if(!done){done=true;res()}};a.onended=fin;a.onerror=fin;
  a.play().then(()=>{setTimeout(fin,((a.duration||8)+1)*1000)}).catch(fin)})}
async function play(...ids){stopAudio();const tok=playToken;unlock();
  for(const id of ids){if(tok!==playToken)return false;
    if(AC.state!=='running'){await new Promise(r=>setTimeout(r,60))}
    if(AC.state==='running'){const b=await loadBuf(id);if(tok!==playToken)return false;
      if(b){await new Promise(res=>{const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.onended=res;curSrc=s;s.start();setTimeout(res,b.duration*1000+600)})}else await playEl(id)}
    else await playEl(id);
    if(tok!==playToken)return false;await new Promise(r=>setTimeout(r,150))}
  return true}
function sfx(type){try{const c=AC,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const t=c.currentTime;g.gain.setValueAtTime(.18,t);
  if(type==='ok'){o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36)}
  else{o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(140,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}}catch(e){}}
/* ---------- helpers ---------- */
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let stars=0, cleared=[]; try{cleared=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
function addStar(n=1){stars+=n;$('#starN').textContent=stars}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1100)}
const buddy=$('#buddy'), bubble=$('#bubble');
function cheer(ok){buddy.classList.remove('yay','oops');void buddy.offsetWidth;buddy.classList.add(ok?'yay':'oops');
  bubble.textContent=ok?shuffle(['Great!','Yes!','Super!','Well done!'])[0]:'Hmm… try again!';bubble.classList.add('on');clearTimeout(cheer.h);cheer.h=setTimeout(()=>bubble.classList.remove('on'),1100)}
function good(){sfx('ok');cheer(true);addStar()}
function bad(){sfx('no');cheer(false)}
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));buddy.classList.toggle('on',id!=='s-home')}
function steps(el,cur){const n=5;el.innerHTML='';for(let i=1;i<=n;i++){const d=document.createElement('i');d.textContent=i;if(i<cur)d.className='f';if(i===cur)d.className='c';el.append(d)}}
function prog(el,n,f){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i<f)d.className='f';el.append(d)}}
function card(img,label,cls=''){const b=document.createElement('button');b.className='card '+cls;b.innerHTML=`<img src="img/${img.includes('.')?img:img+'.png'}" alt="">`+(label?`<span>${label}</span>`:'');return b}
const im=n=>`img/${n.includes('.')?n:n+'.png'}`;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:5+Math.random()*7,c:['#ff7aa8','#ffc83d','#3d7bd9','#3bb36b','#e8382f'][Math.random()*5|0],w:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.w)/12)*1.5;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});if(++f<220)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
function openVideo(start,end){stopAudio();$('#vslot').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${VID}?rel=0&modestbranding=1&playsinline=1&autoplay=1${start!=null?`&start=${start}&end=${end}`:''}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;$('#vbox').classList.add('on')}
$('#vclose').onclick=()=>{$('#vslot').innerHTML='';$('#vbox').classList.remove('on')};
$('#watchAll').onclick=()=>openVideo();
$('#soundTest').onclick=()=>play('I_great');
/* home */
const NSTA=5; // stations built so far
function refresh(){$$('.stop').forEach(s=>{const n=+s.dataset.go;s.classList.toggle('cleared',cleared.includes(n));s.classList.toggle('locked',n>NSTA||(n>1&&!cleared.includes(n-1)))})}
refresh();
$$('.stop').forEach(s=>s.onclick=()=>{const n=+s.dataset.go;if(s.classList.contains('locked')){toast(n>NSTA?'Coming soon! 製作中':'先完成上一站！');return}
  ({1:start1w,2:start2,3:start3,4:start4,5:start5})[n]()});
let lp;$('header h1').addEventListener('pointerdown',()=>lp=setTimeout(()=>{cleared=[1,2,3,4,5];refresh();toast('老師模式：全部解鎖')},1500));
['pointerup','pointerleave'].forEach(e=>$('header h1').addEventListener(e,()=>clearTimeout(lp)));
$('#homeBtn').onclick=()=>{stopAudio();show('s-home');refresh()};
function clearSt(n){if(!cleared.includes(n))cleared.push(n);try{localStorage.setItem(KEY,JSON.stringify(cleared))}catch(e){}}

/* ===== STATION 1 · Welcome to Tokyo! ===== */
function start1w(){steps($('#st1'),1);show('s-1w');play('L01','L02','L03')}
$$('#s-1w .say').forEach(b=>b.onclick=()=>play(b.dataset.a));
$('#clip1').onclick=()=>openVideo(0,77);
$('#w1Go').onclick=()=>start1l();
// learn
let WL=W1,lNext=null;
function start1l(list=W1,next=start1m,stepN=2){WL=list;lNext=next;steps($('#st2'),stepN);const g=$('#learnGrid');g.innerHTML='';const heard=new Set();$('#learnGo').classList.add('hide');$('#learnSub').innerHTML='';
  WL.forEach(w=>{const b=card(w.img,w.t);b.onclick=async()=>{b.classList.add('heard');heard.add(w.k);
    $('#learnSub').innerHTML=w.txt;if(heard.size===WL.length)$('#learnGo').classList.remove('hide');await play(w.wa||'W_'+w.k,w.line)};g.append(b)});
  show('s-1l');play('I_listen')}
$('#learnGo').onclick=()=>lNext();
// map journey: Asia -> 4 islands north to south -> Tokyo -> islands count
const MAPS={};
async function getMap(n){if(!MAPS[n])MAPS[n]=await (await fetch(`img/${n}.svg`)).text();return MAPS[n]}
const JOURNEY=[
 {map:'world_map',targets:['asia'],title:'Where is Asia?',ask:'I_asia',say:['L04'],txt:'Japan is a country in <b>Asia</b>.',color:'#ffb357'},
 {map:'japan4_map',targets:['map-honshu'],title:'Where is Honshu?',ask:'I_honshu',say:['W_honshu','L16'],txt:'<b>Tokyo</b> is on <b>Honshu</b>.',color:'#ffc83d'},
 {map:'japan4_map',targets:['tokyo'],title:'Where is Tokyo?',ask:'I_tokyo',say:['L16','L17'],txt:'<b>Tokyo</b> is on Honshu. It is the <b>capital</b> of Japan.'}];
let ji=0,jt=0,jmiss=0,jlock=false,curMap='';
let JL=JOURNEY,jDone=null;
function start1m(list=JOURNEY,next=start1q,stepN=3){JL=list;jDone=next;steps($('#st3'),stepN);ji=0;curMap='';$('#mapSvg').innerHTML='';$('#mapTitle').textContent='';$('#mapBox').classList.toggle('wave',list!==JOURNEY);show('s-1m');if(list!==JOURNEY)play('I_wave').then(ok=>ok&&jstep());else jstep()}
async function jstep(){const s=JL[ji];jt=0;jmiss=0;jlock=false;$('#ring').classList.remove('on');$('#mapSub').innerHTML='';
  if(curMap!==s.map){$('#mapSvg').innerHTML=await getMap(s.map);curMap=s.map;const vb=$('#mapSvg svg').viewBox.baseVal;$('#mapBox').style.width=`min(94vw, calc((100dvh - 330px) * ${(vb.width/vb.height).toFixed(3)}), 1050px)`}
  $('#mapTitle').textContent=s.title;$('#mapSpk').onclick=()=>play(s.ask);play(s.ask)}
function tEl(){return $('#mapSvg').querySelector('#'+JL[ji].targets[jt])}
function tRect(){const r=tEl().getBoundingClientRect(),b=$('#mapBox').getBoundingClientRect();return {x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height,bw:b.width,bh:b.height}}
function hitTest(e,id){const s=JL[ji];if(s.targets[0]==='asia')return !!e.target.closest('#asia');

function showQ(say=true){const Q=SHOW[qn];prog($('#shProg'),SHOW.length,qn);$('#shTitle').textContent=`Question ${qn+1}`;$('#shWhy').innerHTML='';$('#shPlayers').innerHTML='';
  $('#shCard').innerHTML=`<span class="w">${Q.t}</span>`;$('#shBtns').style.display='';$$('#shBtns .tfb').forEach(b=>b.className='tfb '+(b.dataset.v==='1'?'t':'f'));$('#shSpk').onclick=()=>play(Q.q);let locked=false;
  $$('#shBtns .tfb').forEach(b=>b.onclick=async()=>{if(locked)return;locked=true;const mine=+b.dataset.v,ok=mine===Q.v;if(ok){you++;good()}else bad();
    $$('#shBtns .tfb').forEach(x=>{if(x!==b)x.classList.add('hide')});
    const P=$('#shPlayers');const mk=(head,name,ans)=>{const d=document.createElement('div');d.className='pl';d.innerHTML=(head?`<img src="${im(head)}" alt="">`:'<span class="you">🙋</span>')+`<b>${name}</b><i class="${ans?'t':'f'}">${ans?'TRUE':'FALSE'}</i>`;P.append(d);return d};
    const dy=mk(null,'You',mine);await wait(300);const dl=mk('leo_head','Leo',Q.leo[1]);await play(Q.leo[0]);const dn=mk('nina_head','Nina',Q.nina[1]);await play(Q.nina[0]);
    [[dy,mine],[dl,Q.leo[1]],[dn,Q.nina[1]]].forEach(([d,a])=>d.classList.add(a===Q.v?'right':'wrong'));$('#shBtns').style.display='none';
    $('#shTitle').textContent=Q.v?'TRUE!':'FALSE!';await play(Q.host);askWhy(Q)});
  if(say)setTimeout(()=>play(Q.q),250);else play(Q.q)}
function askWhy(Q){$('#shTitle').textContent='Why?';const W=$('#shWhy');W.innerHTML='';let locked=false;play('I_why');const R=WHY.find(w=>w.k===Q.why);
  shuffle([R,...shuffle(WHY.filter(w=>w!==R)).slice(0,2)]).forEach(o=>{const b=document.createElement('button');b.className='choice long';b.textContent=o.t;
    b.onclick=async()=>{if(locked)return;if(o===R){locked=true;b.classList.add('ok');good();await play(...[].concat(R.a));await wait(300);qn++;qn<SHOW.length?showQ():showScore()}
      else{b.classList.add('no');bad()}};W.append(b)})}

  A.onclick=async()=>{locked=true;A.classList.add('hide');G.style.display=S.style.display='none';$('#hoTitle').textContent='True or false?';B.style.display='';$$('#hoBtns .tfb').forEach(b=>b.className='tfb '+(b.dataset.v==='1'?'t':'f'));
    const truth=th.s===se?1:0;let done=false;await play(`P_${th.k}_${se}`,'I_hostq');
    $$('#hoBtns .tfb').forEach(b=>b.onclick=async()=>{if(done)return;
      if(+b.dataset.v===truth){done=true;b.classList.add('ok');good();$('#hoSub').innerHTML=`We see <b>${th.t}</b> in <b>${th.s}</b>.`;await play(truth?'N_true':'N_false',`P_${th.k}_${th.s}`);await wait(400);hoN++;hoN<3?hostQ():start1s(SENT4,done4)}
      else{b.classList.add('no');bad();$(`#hoBtns .tfb[data-v="${truth}"]`).classList.add('hintc');play(`P_${th.k}_${se}`)}})};
  play('I_host')}
